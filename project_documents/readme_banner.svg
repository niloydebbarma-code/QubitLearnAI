<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="auto">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091e3a" />
      <stop offset="50%" stop-color="#0f2b48" />
      <stop offset="100%" stop-color="#0a192f" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="240" rx="16" fill="url(#bgGrad)" stroke="#1e3a8a" stroke-width="2" />

  <!-- Subtle Decorative Quantum Grid & Circuit Lines -->
  <line x1="60" y1="60" x2="1140" y2="60" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.4" />
  <line x1="60" y1="120" x2="1140" y2="120" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.4" />
  <line x1="60" y1="180" x2="1140" y2="180" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.4" />

  <!-- Quantum Gate Nodes on Grid -->
  <rect x="140" y="44" width="32" height="32" rx="4" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5" />
  <text x="156" y="66" font-family="'Times New Roman', serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">H</text>

  <rect x="240" y="44" width="32" height="32" rx="4" fill="#4338ca" stroke="#818cf8" stroke-width="1.5" />
  <text x="256" y="66" font-family="'Times New Roman', serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">X</text>

  <circle cx="360" cy="60" r="6" fill="#38bdf8" />
  <line x1="360" y1="60" x2="360" y2="120" stroke="#38bdf8" stroke-width="2" />
  <circle cx="360" cy="120" r="12" fill="none" stroke="#38bdf8" stroke-width="2" />
  <line x1="360" y1="108" x2="360" y2="132" stroke="#38bdf8" stroke-width="2" />
  <line x1="348" y1="120" x2="372" y2="120" stroke="#38bdf8" stroke-width="2" />

  <!-- Brand Title -->
  <text x="600" y="92" font-family="'Times New Roman', Times, Georgia, serif" font-size="58" font-weight="bold" fill="url(#accentGrad)" text-anchor="middle" filter="url(#glow)">QubitLearn AI</text>
  
  <!-- Subtitle -->
  <text x="600" y="142" font-family="'Times New Roman', Times, Georgia, serif" font-size="25" font-weight="bold" fill="#ffffff" text-anchor="middle">Interactive Quantum Algorithm &amp; Computing Learning Platform</text>
  
  <!-- Meta / Stack Line -->
  <text x="600" y="186" font-family="'Times New Roman', Times, Georgia, serif" font-size="16" font-weight="bold" fill="#94a3b8" text-anchor="middle">In-Memory Sparse Simulation  •  Multimodal Spatial Vision  •  Lean 4 Formal Verification</text>
</svg>
