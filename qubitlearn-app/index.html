    <script>
      // Compatibility patch: allow window.fetch reassignments without throwing "Cannot set property fetch of #<Window> which has only a getter"
      (function () {
        try {
          var _currentFetch = window.fetch;
          var descriptor = {
            configurable: true,
            enumerable: true,
            get: function () {
              return _currentFetch;
            },
            set: function (fn) {
              _currentFetch = fn;
            },
          };
          try {
            Object.defineProperty(window, 'fetch', descriptor);
          } catch (_) {}
          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', descriptor);
            } catch (_) {}
          }
        } catch (_) {}
      })();
    </script>
