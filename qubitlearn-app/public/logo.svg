<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="qGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="arrowGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#070b14" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="qRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="30%" stop-color="#0284c7" />
      <stop offset="70%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="stateVectorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <radialGradient id="sphereGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#0f172a" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#020617" stop-opacity="1" />
    </radialGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#shieldGrad)" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- Background Quantum Coordinate Grid -->
  <g stroke="#1e293b" stroke-width="1.5" opacity="0.4">
    <line x1="256" y1="96" x2="256" y2="416" stroke-dasharray="4 6" />
    <line x1="96" y1="256" x2="416" y2="256" stroke-dasharray="4 6" />
    <circle cx="256" cy="256" r="176" fill="none" />
  </g>

  <!-- 3D Bloch Sphere Body -->
  <circle cx="240" cy="240" r="140" fill="url(#sphereGrad)" stroke="#334155" stroke-width="2" />
  <ellipse cx="240" cy="240" rx="140" ry="46" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-dasharray="6 4" opacity="0.75" />
  <ellipse cx="240" cy="240" rx="46" ry="140" fill="none" stroke="#6366f1" stroke-width="3" stroke-dasharray="6 4" opacity="0.75" />

  <!-- Quantum Poles |0⟩ and |1⟩ -->
  <circle cx="240" cy="100" r="7" fill="#00f5ff" filter="url(#qGlow)" />
  <circle cx="240" cy="100" r="3" fill="#ffffff" />
  <text x="240" y="82" font-family="'Courier New', monospace" font-size="22" font-weight="bold" fill="#38bdf8" text-anchor="middle">|0⟩</text>

  <circle cx="240" cy="380" r="7" fill="#a855f7" filter="url(#qGlow)" />
  <circle cx="240" cy="380" r="3" fill="#ffffff" />
  <text x="240" y="412" font-family="'Courier New', monospace" font-size="22" font-weight="bold" fill="#c084fc" text-anchor="middle">|1⟩</text>

  <!-- Equator Basis States |+⟩ and |-⟩ -->
  <circle cx="100" cy="240" r="5.5" fill="#0284c7" />
  <text x="76" y="246" font-family="'Courier New', monospace" font-size="18" font-weight="bold" fill="#94a3b8" text-anchor="end">|-⟩</text>

  <circle cx="380" cy="240" r="5.5" fill="#0284c7" />
  <text x="404" y="246" font-family="'Courier New', monospace" font-size="18" font-weight="bold" fill="#94a3b8" text-anchor="start">|+⟩</text>

  <!-- Origin -->
  <circle cx="240" cy="240" r="6" fill="#64748b" />

  <!-- Quantum "Q" Outer Arc -->
  <path d="M 240 76 A 164 164 0 1 0 380 326" fill="none" stroke="url(#qRingGrad)" stroke-width="18" stroke-linecap="round" filter="url(#qGlow)" />

  <!-- Statevector Arrow Forming the "Q" Tail -->
  <g filter="url(#arrowGlow)">
    <line x1="240" y1="240" x2="376" y2="376" stroke="url(#stateVectorGrad)" stroke-width="12" stroke-linecap="round" />
    <polygon points="364,402 428,428 402,364 378,382" fill="url(#stateVectorGrad)" />
  </g>

  <!-- State Vector Label |Ψ⟩ -->
  <g transform="translate(340, 310)">
    <rect x="-6" y="-20" width="54" height="28" rx="6" fill="#090d16" stroke="#10b981" stroke-width="1.5" />
    <text x="21" y="-1" font-family="'Courier New', monospace" font-size="17" font-weight="bold" fill="#34d399" text-anchor="middle">|Ψ⟩</text>
  </g>

  <circle cx="424" cy="424" r="5" fill="#ffffff" filter="url(#qGlow)" />
</svg>
