<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <rect width="64" height="64" rx="16" fill="#090d16" />
  <!-- Bloch Sphere Sphere Outline -->
  <circle cx="30" cy="30" r="18" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
  <ellipse cx="30" cy="30" rx="18" ry="6" fill="none" stroke="#0ea5e9" stroke-width="1.2" stroke-dasharray="2 2" opacity="0.8" />
  
  <!-- Outer "Q" Arc -->
  <path d="M 30 10 A 20 20 0 1 0 46 38" fill="none" stroke="#00f5ff" stroke-width="3.5" stroke-linecap="round" />
  
  <!-- Statevector Arrow Forming the "Q" Tail -->
  <line x1="30" y1="30" x2="48" y2="48" stroke="#10b981" stroke-width="3.2" stroke-linecap="round" />
  <polygon points="45,51 53,53 51,45" fill="#f59e0b" />
  
  <!-- North Pole |0⟩ -->
  <circle cx="30" cy="12" r="2" fill="#38bdf8" />
